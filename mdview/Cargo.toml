[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Small GTK4 Markdown viewer and editor that follows the system GTK theme"
publish = false

# Two crates and no more (docs/mdview-plan.md): every other need is covered by GTK, glib and gio.
[dependencies]
# Plain GTK4, never libadwaita, which ignores the GTK theme. v4_12 covers FileDialog,
# AlertDialog and UriLauncher (all 4.10) and CssProvider::load_from_string (4.12).
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
# Without the default features: no HTML writer and no getopts, neither of which is used.
pulldown-cmark = { version = "0.13.6", default-features = false }

# Copied from minecraft-tui (docs/minecraft-tui.md "Build time"): line tables keep file:line in
# this crate's backtraces; dependency debug info is most of the build cost and rarely needed.
# For a full debugger build: --config 'profile.dev.debug=true'.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Everyday release builds: Cargo's default codegen units and crate-local LTO, kept incremental.
# Optimised for size and aborting on panic: 18% smaller (1.31 MB to 1.07 MB) with no cold-build
# cost, and rendering stays well under a frame (docs/mdview.md "Build time"). A panic inside a
# GTK callback aborts anyway; abort only changes the thread-pool jobs (the autosave write, the
# recovered-file check and a folder sync), whose panic now ends the app instead of being caught
# (an autosave write's showed "Autosave failed"; the last written copy reopens next start).
[profile.release]
incremental = true
strip = true
opt-level = "s"
panic = "abort"

# The smallest binary, for handing out: cargo build --profile dist (lands in target/dist/).
[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = true
