name: Lint Rust

# cargo fmt --check, clippy with warnings as errors, and the unit tests for
# minecraft-tui/, the only Rust crate in this repo. Path-filtered like the
# other lint workflows. Backstop for the local pre-commit hook
# (.githooks/pre-commit), which runs fmt and clippy but not the tests.
on:
  push:
    paths:
      - "minecraft-tui/**"
      - ".github/workflows/lint-rust.yml"
  pull_request:
    paths:
      - "minecraft-tui/**"
      - ".github/workflows/lint-rust.yml"

# A pinned toolchain, so a new stable clippy lint can't fail an unrelated
# change. Keep it at the Rust the pre-commit hook runs locally (rustc
# --version), and bump both together.
env:
  RUSTUP_TOOLCHAIN: "1.100.0"

# bash -eo pipefail for every step, not the bare bash -e GitHub defaults to.
defaults:
  run:
    shell: bash
    working-directory: minecraft-tui

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          cargo --version

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked
