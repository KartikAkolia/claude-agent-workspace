name: Lint Config

# Validates every tracked JSON/YAML file parses cleanly (validate-config.sh)
# -- catches a typo in .claude/settings.json or a workflow file before it
# silently breaks hook/tool wiring at runtime. Skips the five read-only
# reference clones (see AGENTS.md non-negotiable #1). Path-filtered so a
# markdown/bash/Python-only change doesn't also trigger this -- split out of
# the single lint.yml (2026-09-03), see SPEC.md's Testing & CI section for
# why. Backstop for the local pre-commit hook (.githooks/pre-commit).
on:
  push:
    paths:
      - "**.json"
      - "**.yml"
      - "**.yaml"
      - "validate-config.sh"
      - "list-lint-files.sh"
      - "reference-clones.tsv"
      - ".github/workflows/lint-config.yml"
  pull_request:
    paths:
      - "**.json"
      - "**.yml"
      - "**.yaml"
      - "validate-config.sh"
      - "list-lint-files.sh"
      - "reference-clones.tsv"
      - ".github/workflows/lint-config.yml"

# bash -eo pipefail for every step, not the bare bash -e GitHub defaults to.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: validate-config.sh
        # NUL-separated, via a file so a lister failure fails the step (it
        # also fails on an empty list rather than check nothing).
        run: |
          ./list-lint-files.sh -z config >"$RUNNER_TEMP/config-files"
          mapfile -d '' -t files <"$RUNNER_TEMP/config-files"
          ./validate-config.sh "${files[@]}"
