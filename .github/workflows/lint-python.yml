name: Lint Python

# Runs lint-python.sh (ruff check + ruff format --check, via uvx) against
# every tracked .py file, skipping the five read-only reference clones (see
# AGENTS.md non-negotiable #1). Path-filtered so a markdown/bash/config-only
# change doesn't also trigger this -- split out of the single lint.yml
# (2026-09-03), see SPEC.md's Testing & CI section for why. Backstop for the
# local pre-commit hook (.githooks/pre-commit).
on:
  push:
    paths:
      - "**.py"
      - "lint-python.sh"
      - "list-lint-files.sh"
      - "reference-clones.tsv"
      - "lint-versions.sh"
      - ".lint-versions"
      - ".github/workflows/lint-python.yml"
  pull_request:
    paths:
      - "**.py"
      - "lint-python.sh"
      - "list-lint-files.sh"
      - "reference-clones.tsv"
      - "lint-versions.sh"
      - ".lint-versions"
      - ".github/workflows/lint-python.yml"

# bash -eo pipefail for every step, not the bare bash -e GitHub defaults to.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # Gives lint-python.sh's `uvx ruff@<version in .lint-versions>` a
        # resolvable interpreter, no system-wide install needed.
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: lint-python.sh
        # NUL-separated, via a file so a lister failure fails the step (it
        # also fails on an empty list rather than lint nothing).
        run: |
          ./list-lint-files.sh -z python >"$RUNNER_TEMP/python-files"
          mapfile -d '' -t files <"$RUNNER_TEMP/python-files"
          ./lint-python.sh "${files[@]}"

      - name: sync-docs-to-trilium tests
        # Includes reading the real reference-clones.tsv, unstubbed, and
        # checking list-lint-files.sh parses it to the same table. --script
        # installs the test file's own inline dependencies, where markdown
        # is pinned.
        run: uv run -q --script scripts/test_sync_docs_to_trilium.py -v
