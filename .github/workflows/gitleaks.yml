name: gitleaks

# Secret scanning. This repo's docs/configs touch real infrastructure
# (CLIProxyAPI, Vaultwarden, the homelab host, etc.), so this is a genuine
# risk check, not boilerplate. GITLEAKS_LICENSE is only required for
# organization-owned repos, not personal-account repos (private or public) --
# see https://github.com/gitleaks/gitleaks-action -- so it's deliberately
# omitted here.
on:
  push:
  pull_request:

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
